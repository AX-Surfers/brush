name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: brush.py — 셀프테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6는 offscreen 렌더링에도 이 라이브러리들을 링크한다
      - name: Qt 런타임 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: PySide6 설치
        run: python -m pip install --upgrade pip PySide6

      - name: 구문 검사
        run: python -m py_compile brush.py

      - name: 셀프테스트
        env:
          QT_QPA_PLATFORM: offscreen
        run: python brush.py --selftest

  macos:
    name: Brush.swift — 범용 빌드 + 셀프테스트
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # build.sh가 arm64 + x86_64로 컴파일해 합치고 --selftest까지 돌린다
      - name: 빌드 및 셀프테스트
        run: ./build.sh
